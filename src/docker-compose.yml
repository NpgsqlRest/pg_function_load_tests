services:
  postgres:
    restart: unless-stopped
    image: postgres:19.0-alpine
    # Connection calculation:
    # - Tests are SERIALIZED (one service tested at a time)
    # - Active service: 100 connections (pool max)
    # - 21 idle services: ~200 connections (idle pools maintain ~10-20 each)
    # - Total during test: ~300 connections
    # - Setting 2000 provides 6x headroom, avoids memory issues (5000 was excessive)
    # pg_stat_statements: PostgreSQL's own per-test statement count and execution time (see _postgres/stats.sql)
    # max_connections: most services keep a pool of up to 100 connections open once they have been under
    # load, also while paused. 31 services x 100 is 3,100; with 2,000 (enough for the 20 services of July
    # 2026) PostgreSQL refused connections during the November 2026 round. Keep it well above services x 100.
    command: postgres -c 'max_connections=5000' -c 'shared_preload_libraries=pg_stat_statements'
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - ./_postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./_postgres/tables.sql:/docker-entrypoint-initdb.d/tables.sql
      - ./_postgres/stats.sql:/docker-entrypoint-initdb.d/stats.sql
      # for Hasura only: it exposes functions that return SETOF a table, so it gets wrappers in its own schema
      - ./_postgres/hasura.sql:/docker-entrypoint-initdb.d/zz-hasura.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test_network

