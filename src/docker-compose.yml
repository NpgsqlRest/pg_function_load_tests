  test:
    build:
      context: ./_k6
      dockerfile: Dockerfile
    # root + docker socket so run-all.sh can pause idle services during tests
    # (PAUSE_IDLE); results dir may need chmod -R 777 on the host either way
    user: root
    volumes:
      - ./_k6/scripts:/scripts
      - ./_k6/results:/results
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - django-app-v6.0.7
      - fastapi-app-v0.139.0
      - fastify-app-v5.10.0
      - bun-app-v1.3.14
      - go-app-v1.26
      - java25-spring-boot-v4.1.0
      - rust-app-v1.97.0
      - swoole-php-app-v6.2.1
      - express-app-v5.2.1
      - deno-app-v2.9.2
      - axum-app-v0.8.9
      - postgrest-v14.14
      - net10-minapi-ef-jit
      - net10-minapi-dapper-jit
      - npgsqlrest-routine-aot-v3.4.7
      - npgsqlrest-routine-jit-v3.4.7
      - npgsqlrest-routine-aot-v3.21.0
      - npgsqlrest-routine-jit-v3.21.0
      - npgsqlrest-file-aot-v3.21.0
      - npgsqlrest-file-jit-v3.21.0
    entrypoint: ["/bin/sh"]
    command: ["-c", "tail -f /dev/null"]
    networks:
      - test_network

networks:
  test_network:
