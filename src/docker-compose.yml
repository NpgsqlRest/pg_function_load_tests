  hasura-v2.50.10:
    restart: unless-stopped
    # the image that applies the metadata directory at start (which tables and functions are exposed)
    image: hasura/graphql-engine:v2.50.10.cli-migrations-v3
    ports:
      - "3109:3109"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://testuser:testpass@postgres:5432/testdb
      HASURA_GRAPHQL_SERVER_PORT: "3109"
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_LOG_LEVEL: "error"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: "startup"
    volumes:
      - ./hasura-v2.50.10/metadata:/hasura-metadata
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test_network

  test:
    build:
      context: ./_k6
      dockerfile: Dockerfile
    # root + docker socket so run-all.sh can pause idle services during tests
    # (PAUSE_IDLE); results dir may need chmod -R 777 on the host either way
    user: root
    volumes:
      - ./_k6/scripts:/scripts
      - ./_k6/results:/results
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - django-app-v6.1.3
      - fastapi-app-v0.165.0
      - fastify-app-v5.12.8
      - bun-app-v1.4.5
