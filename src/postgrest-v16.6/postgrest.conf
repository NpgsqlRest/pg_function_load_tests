# postgrest.conf
#
# NOT READ by the container as it is started in docker-compose.yml: the image takes its settings from the
# PGRST_* environment variables there. Kept as a description of the intended settings; change them in
# docker-compose.yml.

db-uri = "postgres://testuser:testpass@postgres:5432/testdb"
db-schema = "public"
db-anon-role = "testuser"

jwt-secret           = "reallyreallyreallyreallyverysafe"
jwt-secret-is-base64 = false

server-port = 3000
server-host = "0.0.0.0"

# Match the 100-connection pool every other service uses (default is only 10)
db-pool = 100

# Minimize logging overhead for benchmarks
log-level = "crit"
