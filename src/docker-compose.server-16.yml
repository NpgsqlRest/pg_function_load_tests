# =============================================================================
# SERVER OVERRIDE for a 16 vCPU machine (Hetzner CCX43): more room for PostgreSQL
# and the load generator, so that the service under test is the part that runs
# out of CPU first.
#
# In the July 2026 round (CCX33: PostgreSQL 2 cores, k6 2 cores, service 4 cores)
# a service used at least 85% of its four cores in 18 of 760 tests; in the others
# something else set the pace. See ANALYSIS.md.
#
#   cores 0-5:   PostgreSQL
#   cores 6-9:   k6 load generator (test container)
#   cores 10-13: the service under test
#   cores 14-15: left to the operating system, dockerd and the resource collector
#
# Usage on the benchmark server:
#   docker-compose -f docker-compose.yml -f docker-compose.server-16.yml up --build --detach
# =============================================================================
services:
  postgres:
    cpuset: "0-5"
  test:
    cpuset: "6-9"
  django-app-v6.1.3:
    cpuset: "10-13"
