# =============================================================================
# SERVER OVERRIDE for a 48 vCPU machine (Hetzner CCX63): PostgreSQL and the load
# generator get far more CPU than the service under test, so that the service is
# the part that runs out of CPU first, in every scenario.
#
# The service keeps the four cores it had in July 2026 (CCX33: PostgreSQL 2 cores,
# k6 2 cores, service 4 cores), so its numbers stay comparable with that round;
# what changes is that the other two no longer hold it back. See ANALYSIS.md.
#
#   cores 0-15:  PostgreSQL
#   cores 16-27: k6 load generator (test container)
#   cores 28-31: the service under test
#   cores 32-47: left to the operating system, dockerd and the resource collector
#
# Usage on the benchmark server:
#   docker-compose -f docker-compose.yml -f docker-compose.server-48.yml up --build --detach
# =============================================================================
services:
  postgres:
    cpuset: "0-15"
  test:
    cpuset: "16-27"
  django-app-v6.1.3:
    cpuset: "28-31"
